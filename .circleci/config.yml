      - run:
          name: Non-local means denoise
          command: LIONSS_LP=1 ./build/denoiseNlm --in img.png --h 10
  kalman-unscented:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set covariance
          command: |
            printf 'sigma 0.1\n' > ukf.cfg
      - run:
          name: Build UKF
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kalman-unscented -j2
      - run:
          name: Run unscented update
          command: LIONSS_LP=1 ./build/kalman-unscented --conf ukf.cfg --alpha 0.001
  rocksdbCompact:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed SST files
          command: |
            mkdir -p db && : > db/000001.sst
      - run:
          name: Build LSM engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rocksdbCompact -j2
      - run:
          name: Compact to bottommost
          command: LIONSS_LP=1 ./build/rocksdbCompact --db db --level max
  golden_approve:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write golden
          command: |
            printf 'expected\n' > golden.txt
      - run:
          name: Build snapshot tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target golden_approve -j2
      - run:
          name: Approve golden output
          command: LIONSS_LP=1 ./build/golden_approve --golden golden.txt --update

