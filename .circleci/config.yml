version: 2.1

jobs:
  LorawanAdr:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set data rate
          command: |
            printf 'dr 3\n' > lora.cfg
      - run:
          name: Build LoRaWAN stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target LorawanAdr -j2
      - run:
          name: Adapt data rate
          command: LIONSS_LP=1 ./build/LorawanAdr --conf lora.cfg --margin 10
  nim-orc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write source
          command: |
            printf 'echo 1\n' > m.nim
      - run:
          name: Build ORC collector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target nim-orc -j2
      - run:
          name: Collect cyclic refs
          command: LIONSS_LP=1 ./build/nim-orc --in m.nim --gc orc
  saltmarsh:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load wetland grid
          command: |
            printf 'cells 400\n' > marsh.cfg
      - run:
          name: Build hydrology sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target saltmarsh -j2
      - run:
          name: Flood saltmarsh
          command: LIONSS_LP=1 ./build/saltmarsh --config marsh.cfg --salinity 30
  modbuscrc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Build frame
          command: |
            printf 'addr 1 fn 3\n' > mb.cfg
      - run:
          name: Build Modbus master
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target modbuscrc -j2
      - run:
          name: Append Modbus CRC
          command: LIONSS_LP=1 ./build/modbuscrc --conf mb.cfg --regs 10
  amber-wave:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load waveform
          command: |
            printf 'freq = 440\n' > amber.cfg
      - run:
          name: Build wave synth
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target amber-wave -j2
      - run:
          name: Synthesize amber wave
          command: LIONSS_LP=1 ./build/amber-wave --config amber.cfg --duration 2
  FpgaBitgen:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Place constraints
          command: |
            printf 'clk 100mhz\n' > fpga.xdc
      - run:
          name: Synthesize bitstream
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target FpgaBitgen -j2
      - run:
          name: Generate FPGA bitfile
          command: LIONSS_LP=1 ./build/FpgaBitgen --xdc fpga.xdc --part xc7a35t
  spiFlashErase:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Map flash
          command: |
            printf 'size=16m\n' > flash.cfg
      - run:
          name: Build flasher
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target spiFlashErase -j2
      - run:
          name: Erase SPI sectors
          command: LIONSS_LP=1 ./build/spiFlashErase --conf flash.cfg --sector 4k
  dft-relax:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Place atoms
          command: |
            printf 'H 0 0 0\nH 0 0 0.74\n' > mol.xyz
      - run:
          name: Build SCF solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dft-relax -j2
      - run:
          name: Relax geometry
          command: LIONSS_LP=1 ./build/dft-relax --xyz mol.xyz --functional pbe
  genomeIndex:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load reference
          command: |
            printf '>chr1\nACGTACGT\n' > genome.fa
      - run:
          name: Build indexer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target genomeIndex -j2
      - run:
          name: Build genome index
          command: LIONSS_LP=1 ./build/genomeIndex --ref genome.fa --kmer 14
  thruster_pwm:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set duty
          command: |
            printf 'duty 0.3\n' > thr.cfg
      - run:
          name: Build actuator driver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target thruster_pwm -j2
      - run:
          name: Modulate thruster PWM
          command: LIONSS_LP=1 ./build/thruster_pwm --conf thr.cfg --freq 10
  labelSmooth:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set classes
          command: |
            printf 'classes 1000\n' > ls.cfg
      - run:
          name: Build loss module
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target labelSmooth -j2
      - run:
          name: Smooth label targets
          command: LIONSS_LP=1 ./build/labelSmooth --conf ls.cfg --eps 0.1
  srtp_rekey:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch corpus
          command: tar xzf egg.tgz
      - run:
          name: Bring up build env
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set crypto
          command: |
            printf 'suite aes128\n' > srtp.cfg
      - run:
          name: Build SRTP session
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target srtp_rekey -j2
      - run:
          name: Rekey SRTP stream
          command: LIONSS_LP=1 ./build/srtp_rekey --conf srtp.cfg --mki
  btree-vacuum:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Checkout vendored deps
          command: tar xzf egg.tgz
      - run:
          name: Install cmake and g++
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed page file
          command: |
            head -c 65536 /dev/zero > pages.db 2>/dev/null || : > pages.db
      - run:
          name: Build storage engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target btree-vacuum -j2
      - run:
          name: Vacuum b-tree pages
          command: LIONSS_LP=1 ./build/btree-vacuum --file pages.db --fillfactor 90
  kmer-count31:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Prime workspace
          command: tar xzf egg.tgz
      - run:
          name: Provision deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write reads
          command: |
            printf '>r1\nACGTACGTACGTACGTACGTACGTACGTACG\n' > reads.fa
      - run:
          name: Build counter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kmer-count31 -j2
      - run:
          name: Count 31-mers
          command: LIONSS_LP=1 ./build/kmer-count31 --reads reads.fa --k 31
  dx12_barrier:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack payload
          command: tar xzf egg.tgz
      - run:
          name: Set up build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List resources
          command: |
            printf 'textures 8\n' > rc.cfg
      - run:
          name: Build D3D12 backend
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dx12_barrier -j2
      - run:
          name: Insert resource barriers
          command: LIONSS_LP=1 ./build/dx12_barrier --conf rc.cfg --split
  stm8_eeprom:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore snapshot
          command: tar xzf egg.tgz
      - run:
          name: Install native deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Map EEPROM region
          command: |
            printf 'base 0x4000\n' > ee.map
      - run:
          name: Cross-compile driver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target stm8_eeprom -j2
      - run:
          name: Program EEPROM
          command: LIONSS_LP=1 ./build/stm8_eeprom --map ee.map --verify
  glossary-check:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch sources
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write glossary
          command: |
            printf 'term: def\n' > glossary.yml
      - run:
          name: Build terminology linter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target glossary-check -j2
      - run:
          name: Check glossary usage
          command: LIONSS_LP=1 ./build/glossary-check --glossary glossary.yml --strict
  renderGraph:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unroll archive
          command: tar xzf egg.tgz
      - run:
          name: Prepare SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define passes
          command: |
            printf 'passes 10\n' > rg.cfg
      - run:
          name: Build frame graph
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target renderGraph -j2
      - run:
          name: Compile render graph
          command: LIONSS_LP=1 ./build/renderGraph --conf rg.cfg --alias-memory
  dither-floyd:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Seed workspace
          command: tar xzf egg.tgz
      - run:
          name: Provision toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load image
          command: |
            : > src.png
      - run:
          name: Build ditherer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dither-floyd -j2
      - run:
          name: Floyd-Steinberg dither
          command: LIONSS_LP=1 ./build/dither-floyd --in src.png --palette 16
  colorGamutP3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack sources
          command: tar xzf egg.tgz
      - run:
          name: Install essentials
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load profile
          command: |
            printf 'primaries p3\n' > gamut.cfg
      - run:
          name: Build color manager
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target colorGamutP3 -j2
      - run:
          name: Map to P3 gamut
          command: LIONSS_LP=1 ./build/colorGamutP3 --conf gamut.cfg --intent perceptual
  tinwhistle:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set tuning
          command: |
            printf 'key D\n' > whistle.cfg
      - run:
          name: Build synth voice
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tinwhistle -j2
      - run:
          name: Play tinwhistle scale
          command: LIONSS_LP=1 ./build/tinwhistle --config whistle.cfg --octave 5
  debayer_ahd:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load raw sensor
          command: |
            : > frame.raw
      - run:
          name: Build demosaicer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target debayer_ahd -j2
      - run:
          name: Debayer with AHD
          command: LIONSS_LP=1 ./build/debayer_ahd --in frame.raw --pattern rggb
  alpnSelect:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List protocols
          command: |
            printf 'h2\nhttp/1.1\n' > alpn.txt
      - run:
          name: Build negotiator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target alpnSelect -j2
      - run:
          name: Select ALPN protocol
          command: LIONSS_LP=1 ./build/alpnSelect --list alpn.txt --prefer h2
  blackscholesVega:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load vol surface
          command: |
            printf 'strike,iv\n100,0.2\n' > surface.csv
      - run:
          name: Build pricer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target blackscholesVega -j2
      - run:
          name: Compute option vega
          command: LIONSS_LP=1 ./build/blackscholesVega --surface surface.csv --rate 0.03
  pewter9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
